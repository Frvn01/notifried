name: nowtifried
description: A schedule system with persistent local notifications.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.1
  shared_preferences: ^2.0.15
  intl: ^0.17.0
  permission_handler: ^12.0.1
  # Use a permissive constraint for `home_widget` so pub can resolve packages.
  # If you prefer a specific version or a git source, replace `any` with that.
  home_widget: any
  uuid: ^3.0.6
  flutter_colorpicker: ^1.0.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_svg: ^2.1.0
  google_fonts: ^6.2.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
